observations:
  - name: base_roll
    source: orientation_quaternion
    index: 0
    scale: 1.0
    offset: 0.0
    sensor:
      type: imu 
      model: mpu6050
      i2c:
        bus: 1
        address: 0x68
        scl:21
        sda:22
      pin: 4
      type: roll
  - name: base_pitch
    source: orientation_quaternion
    index: 1
    scale: 1.0
    offset: 0.0
    sensor:
      type: imu
      pin: 4
      type: pitch
  - name: motor_0_target
    source: internal_target_state
    index: 2
    scale: 1.0
    offset: 0.0
  - name: motor_1_target
    source: internal_target_state
    index: 3
    scale: 1.0
    offset: 0.0

actions:
  - name: motor_0
    target: motor
    index: 0
    scale: 1.0
    min: -1.0
    max: 1.0
  - name: motor_1
    target: motor
    index: 1
    scale: 1.0
    min: -1.0
    max: 1.0